{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Taskframe{% endblock %}</title><link rel="stylesheet" href="{% static 'style.css' %}"></head><body><aside><a class="brand" href="{% url 'tasks:index' %}"><b>TF</b><span>TASKFRAME</span></a>{% if user.is_authenticated %}<a href="{% url 'tasks:list' %}">Мои задачи</a><a href="{% url 'tasks:create' %}">Новая задача</a><div class="account"><span>{{ user.username }}</span><form method="post" action="{% url 'users:logout' %}">{% csrf_token %}<button>Выйти</button></form></div>{% else %}<a href="{% url 'users:login' %}">Вход</a><a href="{% url 'users:register' %}">Регистрация</a>{% endif %}</aside><main>{% block content %}{% endblock %}</main></body></html>
